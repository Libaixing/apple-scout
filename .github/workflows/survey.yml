name: Daily Survey

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run SMZDM probe
        run: python survey/probe_apple_refurb.py
      - name: Commit samples and results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add survey/samples/ survey/results.csv
          git diff --staged --quiet || git commit -m "Survey: update samples and results [skip ci]"
          git push
